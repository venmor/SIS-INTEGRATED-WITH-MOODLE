name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
defaults:
  run:
    working-directory: development
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: sis_ci_review
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d sis_ci_review"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sis_ci_review
      DEMO_MODE: "true"
      # Explicit simulator fixture only; never a provider or deployment secret.
      FIN_SIM_SECRET: ci-finance-simulator-fixture-only
      SIS_ENABLE_TIMETABLE_DEMO_DRAFTS: "true"
      APPLICATION_SCANNER: demo-fixtures
      API_INTERNAL_URL: http://127.0.0.1:3101
      PORT: "3101"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: development/.nvmrc
          cache: npm
          cache-dependency-path: development/package-lock.json
      - name: Install CI source-scan dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ripgrep
      - run: npm ci
      - name: Build the API and its shared dependency from a clean checkout
        run: npm run build --workspace=apps/api
      - run: npm run scan && npm run test:scripts
      - run: npm run lint
      - run: npx prisma validate && npx prisma migrate deploy
      - run: ALLOW_DEMO_SEED=true node prisma/seed/seed.ts
      - run: node scripts/prepare-test-offerings.mjs
      - run: npm test
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install --no-install-recommends -y postgresql-client-18
      - name: Run connected suites against independent baseline clones
        run: node scripts/isolated-e2e.mjs
        env:
          CI_BACKUP_REHEARSAL: "true"
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Use a fresh browser database
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d postgres -c 'CREATE DATABASE sis_browser_review'
          DATABASE_URL=postgresql://ci:ci@localhost:5432/sis_browser_review npx prisma migrate deploy
          DATABASE_URL=postgresql://ci:ci@localhost:5432/sis_browser_review SIS_ENABLE_INSTITUTION_DEMO_SETUP=true ALLOW_DEMO_SEED=true node prisma/seed/seed.ts
      - run: npm run test:browser
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/sis_browser_review
          SIS_ENABLE_INSTITUTION_DEMO_SETUP: "true"
      - name: Verify isolated Moodle deferral rendering
        run: npx playwright test --config=tests/browser/moodle-live-deferral.config.ts
      - name: Verify Moodle operations UI and recovery controls
        run: npx playwright test --config=playwright.moodle-ui.config.ts
      # Populated finance and assessment clones were rehearsed before cleanup.
      # Also verify the clean seeded baseline independently.
      - name: Backup/restore rehearsal on the seeded database
        run: npm run backup:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            development/playwright-report/
            development/test-results/
