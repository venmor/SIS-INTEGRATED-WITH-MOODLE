# Phase 0 CI — simplified pipeline per handbook 19.31 ("keep simple initially").
# Order follows 19.31: install → format → lint → type → unit → validate →
# build → scan → report. Playwright E2E + a11y jobs arrive with the first
# journey slice. Activation note: GitHub discovers workflows at the REPO ROOT
# .github/workflows — copy this file there when connecting the GitHub repo
# (recorded in TASK-PH0-005); until then, replay every step locally.

name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: development

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Parse-only dummy so `prisma validate` never needs a live database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: development/.nvmrc
          cache: npm
          cache-dependency-path: development/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Formatting check (API)
        working-directory: development/apps/api
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Lint workspaces
        run: npm run lint --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

      - name: Prisma validate
        run: npx prisma validate

      - name: Build web and API
        run: npm run build --workspace=apps/web --workspace=apps/api

      - name: Forbidden-pattern and secret scan (no new deps)
        run: |
          rg -n -i "linear-gradient|radial-gradient|backdrop-filter:\s*blur|chatbot" apps/web/app packages/ui/src && exit 1 || true
          rg -n -i "BEGIN (RSA )?PRIVATE KEY|sk-live|ghp_[A-Za-z0-9]{20,}" --glob '!package-lock.json' . && exit 1 || true
          echo "scan clean"

      - name: Report status
        if: always()
        run: echo "CI finished — see per-step results above (merge blocked unless all green)."
